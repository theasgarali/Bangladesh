<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estate of Late Akram Ali — Digital Record Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F1E6; --paper2:#EFEADB; --ink:#26221A; --ink2:#5C5544; --rule:#C9C0A8;
  --seal:#5F3E9E; --seal-soft:#E8E1F4;
  --sa:#B4761F; --sa-soft:#F6DFB4;
  --rs:#2E7D45; --rs-soft:#CBE7CE;
  --mu:#2B5FA3; --mu-soft:#C4DCF5;
  --miss:#B4392F; --miss-soft:#F2CFCB;
  --unk:#C00000;
  --card:#FBF8F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Tiro Bangla',Georgia,'Noto Serif Bengali',serif;font-size:17px;line-height:1.55;
  background-image:repeating-linear-gradient(0deg,transparent 0 34px,rgba(95,62,158,.035) 34px 35px);}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* ---------- masthead ---------- */
header{border-bottom:3px double var(--ink);background:linear-gradient(180deg,#F2ECDD, var(--paper));}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 0 14px;flex-wrap:wrap}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);margin-bottom:6px}
h1{font-size:clamp(26px,4.4vw,42px);line-height:1.12;font-weight:400}
h1 .thin{color:var(--ink2)}
.sub{color:var(--ink2);font-size:15px;margin-top:6px}
.langbox{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.langbox button{font-family:inherit;font-size:15px;padding:7px 18px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.langbox button.on{background:var(--ink);color:var(--paper)}
.langbox button:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
/* ---------- tabs ---------- */
nav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0}
.tabs button{font-family:inherit;font-size:16px;padding:9px 18px 8px;border:1.5px solid var(--rule);border-bottom:none;
  border-radius:10px 10px 0 0;background:var(--paper2);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);border-color:var(--ink);position:relative;top:1.5px;font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
main{padding:26px 0 70px}
section.tabpane{display:none}
section.tabpane.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.tabpane.on{animation:none}}
/* ---------- shared bits ---------- */
h2{font-size:24px;font-weight:600;margin:8px 0 4px}
h3{font-size:19px;font-weight:600;margin:22px 0 8px}
p.lead{color:var(--ink2);max-width:72ch}
.badge{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid;vertical-align:2px}
.b-sa{background:var(--sa-soft);border-color:var(--sa);color:#6d4712}
.b-rs{background:var(--rs-soft);border-color:var(--rs);color:#1d5a30}
.b-mu{background:var(--mu-soft);border-color:var(--mu);color:#1c4478}
.b-deed{background:var(--seal-soft);border-color:var(--seal);color:#43296f}
.unk{color:var(--unk);font-weight:600}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:2px 10px;border-radius:6px;border:1px solid var(--rule);background:#fff}
.s-have{background:var(--rs-soft);border-color:var(--rs)}
.s-photo{background:var(--sa-soft);border-color:var(--sa)}
.s-miss{background:var(--miss-soft);border-color:var(--miss)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:16px 18px;position:relative}
.card .type-tab{position:absolute;left:-1.5px;top:14px;bottom:14px;width:5px;border-radius:0 3px 3px 0}
.t-sa{background:var(--sa)}.t-rs{background:var(--rs)}.t-mu{background:var(--mu)}.t-deed{background:var(--seal)}.t-adm{background:var(--seal)}
.seal{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:2px solid var(--seal);
  border-radius:50%;color:var(--seal);font-size:10px;text-align:center;line-height:1.15;transform:rotate(-8deg);
  font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;background:rgba(95,62,158,.05);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:15.5px;margin-top:8px}
.kv dt{color:var(--ink2)}
.kv dd{font-weight:600}
/* ---------- plot pills ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px}
.pills button{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:7px 13px;border-radius:8px;border:1.5px solid var(--rule);
  background:#fff;color:var(--ink);cursor:pointer;flex:none}
.pills button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pills button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
/* ---------- khatiyan-row plot detail (signature) ---------- */
.krow{background:var(--card);border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:4px 4px 0 rgba(38,34,26,.12)}
.krow-head{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--paper2);
  border-bottom:1.5px solid var(--ink);padding:10px 16px;flex-wrap:wrap}
.krow-head .dag{font-size:26px;font-weight:600}
.kcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.kcol{padding:12px 16px;border-right:1px solid var(--rule);border-top:1px solid var(--rule)}
.kcol:last-child{border-right:none}
.kcol .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-family:'IBM Plex Mono',monospace}
.kcol .val{font-size:20px;font-weight:600;margin-top:2px}
.kcol .sm{font-size:13.5px;color:var(--ink2)}
.knote{border-top:1.5px dashed var(--rule);padding:10px 16px;font-size:14.5px;color:var(--ink2)}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:10px}
.chain .arrow{color:var(--ink2)}
/* ---------- ledger table ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--paper2);font-weight:600;font-size:14px}
td.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px}
.tblwrap{overflow-x:auto;border:1.5px solid var(--ink);border-radius:6px}
/* ---------- tracker ---------- */
.trk-sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.trk-sum .pill{font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid}
.trow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--rule);
  border-radius:8px;background:var(--card);padding:10px 14px;margin-bottom:8px}
.trow .st{font-size:24px;width:48px;height:44px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;cursor:pointer}
.trow .st:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.st.have{background:var(--rs-soft);border-color:var(--rs)}
.st.photo{background:var(--sa-soft);border-color:var(--sa)}
.st.miss{background:var(--miss-soft);border-color:var(--miss)}
.trow .nm{font-size:15.5px}
.trow .nm .w{display:block;font-size:13px;color:var(--ink2)}
.trow .pri{font-size:13px;color:var(--ink2);white-space:nowrap}
.tgroup{margin:20px 0 8px;font-size:17px;font-weight:600;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.btn{font-family:inherit;font-size:14.5px;padding:7px 16px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
.btn:hover{background:var(--paper2)}
.note-io{font-size:13.5px;color:var(--ink2)}
.footer{border-top:3px double var(--ink);margin-top:40px;padding:18px 0 30px;color:var(--ink2);font-size:14px}
.statusband{border:1.5px solid var(--miss);background:var(--miss-soft);border-radius:8px;padding:13px 16px;font-size:15.5px;margin:10px 0 18px}
.statusband b{color:#7a231b}
.reclink{display:inline-block;font-size:13.5px;padding:4px 12px;border:1.5px solid var(--seal);border-radius:999px;color:var(--seal);text-decoration:none;background:rgba(95,62,158,.06)}
.reclink:hover{background:var(--seal-soft)}
.recfile{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);word-break:break-all}
.hero-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}
.fig{border:1.5px solid var(--ink);border-radius:8px;background:var(--card);padding:14px 16px;position:relative;overflow:hidden}
.fig .n{font-size:30px;font-weight:600}
.fig .l{color:var(--ink2);font-size:14px}
.fig .band{position:absolute;top:0;left:0;right:0;height:5px}
@media(max-width:640px){ .trow{grid-template-columns:56px 1fr} .trow .pri{grid-column:2} }
</style>
</head>

    <h3 style="margin-top:0">${lang==='bn'?'তফসিলের নমুনা — অসম্পূর্ণ ও অযাচাইকৃত':'Schedule extract — partial and unverified'}</h3>
    <p style="font-size:15px">${q(lang==='bn'
      ?'দলিলের তফসিলে এই তথ্যাদির অপেক্ষা আরও বহু দাগ তালিকাভুক্ত — কিন্তু হস্তলিপি এতই ক্ষীণ যে নির্ভরযোগ্য দাগ-ওয়ারি পাঠ সম্ভব নহে। পাঠযোগ্য কিছু অংশ: দাগ ২৪৮, ২৪৯, ২৪৫, ১৬৪, ১৬৫, ১৯৪, ২০৪, ২০২, ১৪০ এবং ২৭–২৮ ও ৬৫–৬৬ শতকের কাছাকাছি কিছু পরিমাণ — কিন্তু ইহা আংশিক নমুনা মাত্র, সম্পূর্ণ বা নিশ্চিত দাগ-তালিকা নহে।'
      :'The deed’s schedule (tafsil) lists many more plots than these facts capture — the handwriting is too faint for a reliable dag-by-dag reading. Legible fragments include dag numbers such as 248, 249, 245, 164, 165, 194, 204, 202, 140, and areas around 27–28 and 65–66 shatak — but this is a partial sample, not a complete or confirmed plot list.')}</p>
    <p style="font-size:14.5px;color:var(--ink2)">${q(lang==='bn'
      ?'এই কারণে এই মৌজার জন্য শামেরকোনা/জালালপুরের মতো দাগ-ভিত্তিক তালিকা দেওয়া হয় নাই — নির্ভরযোগ্য উপাত্ত ব্যতীত মিথ্যা নিশ্চয়তা দেখানো এড়াইতে।'
      :'For this reason this mouza doesn’t get a dag-by-dag list the way Shamerkona and Jalalpur do — better to show the real gap than false precision.')}</p></div>
  </div>

  <h3>${lang==='bn'?'কেন ইহা ভিন্নভাবে দেখা হয়':'Why it’s treated differently'}</h3>
  <p style="font-size:15px;max-width:74ch">${q(lang==='bn'
    ?'প্রায় ৪৫ বৎসর দখলহীন থাকিবার পর এই জমি পুনরুদ্ধার অত্যন্ত অসম্ভাব্য — সাধারণ মেয়াদোত্তীর্ণ আইন বহু পূর্বে অতিক্রান্ত, এবং অর্পিত সম্পত্তি ফেরতের বিশেষ সময়সীমা প্রায় ২০১২–১৩ সালে বন্ধ হইয়া যায়। তাই উত্তরাধিকার কৌশলপত্র ইহাকে অনাদায়ী ব্যয় (sunk cost) হিসাবে গণ্য করে এবং শামেরকোনা ও জালালপুরের বণ্টন-আলোচনার বাহিরে রাখে, যাহাতে ইহা প্রতিপক্ষের জন্য বিতর্কের বিষয় না হয়।'
    :'After roughly 45 years without possession, recovering this land is very unlikely — the ordinary limitation period has long expired, and the special windows for reclaiming vested-property land closed around 2012–13. The inheritance strategy therefore treats this as a sunk cost and keeps it out of the partition talks over Shamerkona and Jalalpur, so it doesn’t become something for the other side to argue about.')}</p>

  <h3>${lang==='bn'?'তবু যাহা নিষ্পত্তি করা দরকার':'Still worth settling'}</h3>
  <div class="tblwrap"><table><tbody>
   <tr><td style="width:46%">${lang==='bn'?'১ম পাতার ১–৩ পঙ্‌ক্তি পুনঃছবি (ক্রেতার নাম ও সঠিক পরিমাণ নিশ্চিতে)':'Re-photograph sheet 1, lines 1–3 (confirms buyer’s name & exact quantity)'}</td>
    <td>${lang==='bn'?'হাতে থাকা কপিতেই করণীয়':'Action on the copy already held'}</td></tr>
   <tr><td>${lang==='bn'?'নতুন জাবেদা নকল':'Fresh certified copy'}</td>
    <td>${lang==='bn'?'জেলা রেজিস্ট্রারের দফতর, মৌলভীবাজার':'District Registrar’s office, Moulvibazar'}</td></tr>
   <tr><td>${lang==='bn'?'এই দাগসমূহের বর্তমান খতিয়ান — এখন কাহার নামে':'Current khatiyan of these dags — who holds them today'}</td>
    <td>${lang==='bn'?'সংশ্লিষ্ট মৌজার ভূমি অফিস':'Local Union / Upazila Land Office'}</td></tr>
   <tr><td>${lang==='bn'?'দাস গুপ্ত বিক্রেতাগণের রেজিস্ট্রি সূচি, ১৯৭৫–৮৫ (দ্বৈত-বিক্রয় যাচাই)':'Registry index — Das Gupta vendors, 1975–85 (double-sale check)'}</td>
    <td>${lang==='bn'?'সাব-রেজিস্ট্রি, মৌলভীবাজার / রাজনগর':'Sub-Registry, Moulvibazar / Rajnagar'}</td></tr>
  </tbody></table></div>
  <p style="font-size:14px;color:var(--ink2);margin-top:8px">${lang==='bn'
    ?'এই চারটি আইটেম ট্র্যাকার ট্যাবের \u201Cঘ. ১৯৮০ সালের দলিল\u201D অংশেও রহিয়াছে।'
    :'These four items also appear under the Tracker tab, group D — the 1980 deed.'}</p>
 `;
}

function recs(){
 const G=[
  {id:'sham',t:{en:'Mouza Shamerkona — J.L. 102, Moulvibazar Sadar',bn:'মৌজা শামেরকোনা — জে.এল. ১০২, মৌলভীবাজার সদর'}},
  {id:'jal',t:{en:'Mouza Jalalpur — J.L. 119, Rajnagar',bn:'মৌজা জালালপুর — জে.এল. ১১৯, রাজনগর'}},
  {id:'bar',t:{en:'Mouza Baruna [?] — J.L. 47 [?] · the 1980 deed',bn:'মৌজা বরুনা [?] — জে.এল. ৪৭ [?] · ১৯৮০ সালের দলিল'}},
  {id:'court',t:{en:'Court papers — Sylhet & High Court Division',bn:'আদালতের কাগজপত্র — সিলেট ও হাইকোর্ট বিভাগ'}},
  {id:'fam',t:{en:'Family & administrative',bn:'পারিবারিক ও প্রশাসনিক'}},
 ];
 const card=r=>`
   <div class="card"><span class="type-tab t-${r.t}"></span>
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">${badge(r.t)} ${statChip(r.st)}</div>
    <h3 style="margin:8px 0 2px">${q(r.ti[lang])}</h3>
    <div style="color:var(--ink2);font-size:15px">${q(r.who[lang])}</div>
    <div style="font-size:15px;margin-top:6px">${q(r.x[lang])}</div>
    ${r.file?`<div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${(Array.isArray(r.file)?r.file:[{f:r.file}]).map(o=>`<a class="reclink" href="records/${o.f}" target="_blank" rel="noopener">📄 ${o.l?o.l[lang]:(lang==='bn'?'নকল দেখুন':'View copy')}</a> <span class="recfile">records/${o.f}</span>`).join(' ')}</div>`:''}
   </div>`;
 let out=`<h2>${lang==='bn'?'খতিয়ান ও দলিলের ভান্ডার':'Record library'}</h2>
  <p class="lead">${lang==='bn'?'মৌজা-ওয়ারি সাজানো — প্রতিটি রেকর্ডের ধরন, ধারক, মোট পরিমাণ ও নকলের অবস্থা।':'Grouped by mouza — each record’s type, holders, total and copy status.'}</p>
  <p class="note-io" style="margin-top:6px">${lang==='bn'
    ?'“নকল দেখুন” লিংকগুলি এই পাতার পাশের records/ ফোল্ডারের স্ক্যান-ফাইল খোলে। গিটহাব রিপোজিটরিতে ঐ নামের ফোল্ডার তৈরি করিয়া প্রতিটি স্ক্যান লিংকের পাশে দেখানো হুবহু নামে আপলোড করিলেই লিংক কাজ করিবে।'
    :'The “View copy” links open scans from a records/ folder next to this page. Create that folder in your GitHub repository and upload each scan with the exact filename shown beside the link — the links then work automatically.'}</p>`;
 G.forEach(g=>{
   const items=RECS.filter(r=>r.m===g.id);
   out+=`<h3 style="border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-top:26px">${q(g.t[lang])}</h3>
    <div class="grid g2" style="margin-top:12px">${items.map(card).join('')}</div>`;
 });
 $('pane-rec').innerHTML=out;
}
function tracker(){
 const counts={have:0,photo:0,miss:0};
 TRK.filter(t=>t.id).forEach(t=>counts[trkState[t.id]||t.d]++);
 let html=`<h2>${lang==='bn'?'ভূমি রেকর্ড ট্র্যাকার':'Land records tracker'}</h2>
  <p class="lead">${L.trkHow[lang]} <span class="note-io">${storageOK?L.saved[lang]:L.nosave[lang]}</span></p>
  <div class="trk-sum">
   <span class="pill" style="background:var(--rs-soft);border-color:var(--rs)">☑ ${nb(counts.have)} — ${L.have[lang]}</span>
   <span class="pill" style="background:var(--sa-soft);border-color:var(--sa)">◐ ${nb(counts.photo)} — ${L.photo[lang]}</span>
   <span class="pill" style="background:var(--miss-soft);border-color:var(--miss)">☐ ${nb(counts.miss)} — ${L.miss[lang]}</span>
   <button class="btn" onclick="resetTrk()">${L.reset[lang]}</button>
  </div>`;
 TRK.forEach(t=>{
  if(t.g){html+=`<div class="tgroup">${t.g[lang]}</div>`;return;}
  const st=trkState[t.id]||t.d;
  const pri=t.p==='—'?'—':L[t.p][lang];
  html+=`<div class="trow">
    <button class="st ${st}" aria-label="${L.status[lang]}" onclick="cycTrk('${t.id}')">${SYM[st]}</button>
    <div class="nm">${q(lang==='bn'?t.bn:t.en)}<span class="w">${q(t.w[lang])}</span></div>
    <div class="pri">${L.pri[lang]}: ${pri}</div></div>`;
 });
 $('pane-trk').innerHTML=html;
}
window.cycTrk=async id=>{
 const item=TRK.find(t=>t.id===id); const cur=trkState[id]||item.d;
 trkState[id]=CYCLE[(CYCLE.indexOf(cur)+1)%3];
 tracker(); saveTrk();
};
window.resetTrk=()=>{ if(confirm(lang==='bn'?'সব অবস্থা পূর্বনির্ধারিত মানে ফিরিবে?':'Reset all statuses to the defaults?')){trkState={};tracker();saveTrk();} };
async function saveTrk(){ if(!storageOK)return; try{ await window.storage.set('akram-estate-tracker-v1', JSON.stringify(trkState)); }catch(e){} }
async function loadTrk(){ if(!(window.storage&&window.storage.get)){storageOK=false;return;} storageOK=true;
 try{ const r=await window.storage.get('akram-estate-tracker-v1'); if(r&&r.value)trkState=JSON.parse(r.value)||{}; }catch(e){ trkState={}; } }
/* ---------- tabs & lang ---------- */
const TABIDS=['pane-overview','pane-sham','pane-jal','pane-baruna','pane-rec','pane-trk'];
let tab=0;
function drawTabs(){ $('tabbar').innerHTML=L.tabs[lang].map((t,i)=>`<button class="${i===tab?'on':''}" onclick="setTab(${i})">${t}</button>`).join(''); 
 TABIDS.forEach((id,i)=>$(id).classList.toggle('on',i===tab)); }
window.setTab=i=>{tab=i;render();window.scrollTo({top:0});};
window.setLang=l=>{lang=l;document.documentElement.lang=l;render();};
function render(){
 $('lang-en').classList.toggle('on',lang==='en'); $('lang-bn').classList.toggle('on',lang==='bn');
 document.querySelectorAll('[data-l]').forEach(el=>{el.innerHTML=q(L[el.dataset.l][lang]);});
 drawTabs(); overview();
 mouzaPane('pane-sham',SHAM,'sham',
  {t:{en:'Mouza Shamerkona — J.L. 102, Moulvibazar Sadar',bn:'মৌজা শামেরকোনা — জে.এল. ১০২, মৌলভীবাজার সদর'},
   p:{en:'Three plots from R.S. Khatiyan 22, half mutated to the heirs in 2024 (Mutation 1224, DCR paid 30/03/2024). The other half is with Late Nurul Islam’s line.',
      bn:'আর.এস. খতিয়ান ২২-এর তিনটি দাগ; ২০২৪-এ অর্ধেক ওয়ারিশগণের নামে নামজারি (নামজারি ১২২৪, ডিসিআর ৩০/০৩/২০২৪)। বাকি অর্ধেক প্রয়াত নুরুল ইসলামের পক্ষে।'}},
  {en:'25.50 shatak = 0.255 acre (in words on the record: zero acre, twenty-five shatak fifty).',bn:'২৫.৫০ শতক = ০.২৫৫ একর (রেকর্ডে কথায়: শূন্য একর পঁচিশ শতক পঞ্চাশ)।'});
 mouzaPane('pane-jal',JAL,'jal',
  {t:{en:'Mouza Jalalpur — J.L. 119, Rajnagar',bn:'মৌজা জালালপুর — জে.এল. ১১৯, রাজনগর'},
   p:{en:'Twenty-three plot entries under Mutation Khatiyan 1157 (2024), drawn from source khatiyans 16, 14, 18, 17 and 15 — plus Khatiyan 26, already in the brothers’ names. Every figure reconciles: page-1 subtotal 4-87.20, grand total 5-81.20.',
      bn:'নামজারি খতিয়ান ১১৫৭ (২০২৪)-এর ২৩টি দাগ-এন্ট্রি — আগত খতিয়ান ১৬, ১৪, ১৮, ১৭ ও ১৫ হইতে — সহ খতিয়ান ২৬, যাহা আগেই ভাইদের নামে। প্রতিটি অঙ্ক মিলে: ১ম পৃষ্ঠার উপ-মোট ৪-৮৭.২০, সর্বমোট ৫-৮১.২০।'}},
  {en:'581.20 shatak = 5.812 acres (in words on the record: five point eight one two acres only) — plus 21.51 Sh in Khatiyan 26.',
   bn:'৫৮১.২০ শতক = ৫.৮১২ একর (রেকর্ডে কথায়: পাঁচ দশমিক আট এক দুই একর মাত্র) — সহ খতিয়ান ২৬-এ ২১.৫১ শঃ।'});
 baruna(); recs(); tracker();
}
(async()=>{ await loadTrk(); render(); })();
</script>
