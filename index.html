<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estate of Late Akram Ali — Digital Record Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F1E6; --paper2:#EFEADB; --ink:#26221A; --ink2:#5C5544; --rule:#C9C0A8;
  --seal:#5F3E9E; --seal-soft:#E8E1F4;
  --sa:#B4761F; --sa-soft:#F6DFB4;
  --rs:#2E7D45; --rs-soft:#CBE7CE;
  --mu:#2B5FA3; --mu-soft:#C4DCF5;
  --miss:#B4392F; --miss-soft:#F2CFCB;
  --unk:#C00000;
  --card:#FBF8F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Tiro Bangla',Georgia,'Noto Serif Bengali',serif;font-size:17px;line-height:1.55;
  background-image:repeating-linear-gradient(0deg,transparent 0 34px,rgba(95,62,158,.035) 34px 35px);}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* ---------- masthead ---------- */
header{border-bottom:3px double var(--ink);background:linear-gradient(180deg,#F2ECDD, var(--paper));}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 0 14px;flex-wrap:wrap}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);margin-bottom:6px}
h1{font-size:clamp(26px,4.4vw,42px);line-height:1.12;font-weight:400}
h1 .thin{color:var(--ink2)}
.sub{color:var(--ink2);font-size:15px;margin-top:6px}
.langbox{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.langbox button{font-family:inherit;font-size:15px;padding:7px 18px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.langbox button.on{background:var(--ink);color:var(--paper)}
.langbox button:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
/* ---------- tabs ---------- */
nav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0}
.tabs button{font-family:inherit;font-size:16px;padding:9px 18px 8px;border:1.5px solid var(--rule);border-bottom:none;
  border-radius:10px 10px 0 0;background:var(--paper2);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);border-color:var(--ink);position:relative;top:1.5px;font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
main{padding:26px 0 70px}
section.tabpane{display:none}
section.tabpane.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.tabpane.on{animation:none}}
/* ---------- shared bits ---------- */
h2{font-size:24px;font-weight:600;margin:8px 0 4px}
h3{font-size:19px;font-weight:600;margin:22px 0 8px}
p.lead{color:var(--ink2);max-width:72ch}
.badge{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid;vertical-align:2px}
.b-sa{background:var(--sa-soft);border-color:var(--sa);color:#6d4712}
.b-rs{background:var(--rs-soft);border-color:var(--rs);color:#1d5a30}
.b-mu{background:var(--mu-soft);border-color:var(--mu);color:#1c4478}
.b-deed{background:var(--seal-soft);border-color:var(--seal);color:#43296f}
.unk{color:var(--unk);font-weight:600}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:2px 10px;border-radius:6px;border:1px solid var(--rule);background:#fff}
.s-have{background:var(--rs-soft);border-color:var(--rs)}
.s-photo{background:var(--sa-soft);border-color:var(--sa)}
.s-miss{background:var(--miss-soft);border-color:var(--miss)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:16px 18px;position:relative}
.card .type-tab{position:absolute;left:-1.5px;top:14px;bottom:14px;width:5px;border-radius:0 3px 3px 0}
.t-sa{background:var(--sa)}.t-rs{background:var(--rs)}.t-mu{background:var(--mu)}.t-deed{background:var(--seal)}.t-adm{background:var(--seal)}
.seal{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:2px solid var(--seal);
  border-radius:50%;color:var(--seal);font-size:10px;text-align:center;line-height:1.15;transform:rotate(-8deg);
  font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;background:rgba(95,62,158,.05);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:15.5px;margin-top:8px}
.kv dt{color:var(--ink2)}
.kv dd{font-weight:600}
/* ---------- plot pills ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px}
.pills button{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:7px 13px;border-radius:8px;border:1.5px solid var(--rule);
  background:#fff;color:var(--ink);cursor:pointer;flex:none}
.pills button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pills button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
/* ---------- khatiyan-row plot detail (signature) ---------- */
.krow{background:var(--card);border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:4px 4px 0 rgba(38,34,26,.12)}
.krow-head{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--paper2);
  border-bottom:1.5px solid var(--ink);padding:10px 16px;flex-wrap:wrap}
.krow-head .dag{font-size:26px;font-weight:600}
.kcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.kcol{padding:12px 16px;border-right:1px solid var(--rule);border-top:1px solid var(--rule)}
.kcol:last-child{border-right:none}
.kcol .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-family:'IBM Plex Mono',monospace}
.kcol .val{font-size:20px;font-weight:600;margin-top:2px}
.kcol .sm{font-size:13.5px;color:var(--ink2)}
.knote{border-top:1.5px dashed var(--rule);padding:10px 16px;font-size:14.5px;color:var(--ink2)}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:10px}
.chain .arrow{color:var(--ink2)}
/* ---------- ledger table ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--paper2);font-weight:600;font-size:14px}
td.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px}
.tblwrap{overflow-x:auto;border:1.5px solid var(--ink);border-radius:6px}
/* ---------- tracker ---------- */
.trk-sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.trk-sum .pill{font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid}
.trow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--rule);
  border-radius:8px;background:var(--card);padding:10px 14px;margin-bottom:8px}
.trow .st{font-size:24px;width:48px;height:44px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;cursor:pointer}
.trow .st:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.st.have{background:var(--rs-soft);border-color:var(--rs)}
.st.photo{background:var(--sa-soft);border-color:var(--sa)}
.st.miss{background:var(--miss-soft);border-color:var(--miss)}
.trow .nm{font-size:15.5px}
.trow .nm .w{display:block;font-size:13px;color:var(--ink2)}
.trow .pri{font-size:13px;color:var(--ink2);white-space:nowrap}
.tgroup{margin:20px 0 8px;font-size:17px;font-weight:600;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.btn{font-family:inherit;font-size:14.5px;padding:7px 16px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
.btn:hover{background:var(--paper2)}
.note-io{font-size:13.5px;color:var(--ink2)}
.footer{border-top:3px double var(--ink);margin-top:40px;padding:18px 0 30px;color:var(--ink2);font-size:14px}
.statusband{border:1.5px solid var(--miss);background:var(--miss-soft);border-radius:8px;padding:13px 16px;font-size:15.5px;margin:10px 0 18px}
.statusband b{color:#7a231b}
.reclink{display:inline-block;font-size:13.5px;padding:4px 12px;border:1.5px solid var(--seal);border-radius:999px;color:var(--seal);text-decoration:none;background:rgba(95,62,158,.06)}
.reclink:hover{background:var(--seal-soft)}
.recfile{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);word-break:break-all}
.hero-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}
.fig{border:1.5px solid var(--ink);border-radius:8px;background:var(--card);padding:14px 16px;position:relative;overflow:hidden}
.fig .n{font-size:30px;font-weight:600}
.fig .l{color:var(--ink2);font-size:14px}
.fig .band{position:absolute;top:0;left:0;right:0;height:5px}
@media(max-width:640px){ .trow{grid-template-columns:56px 1fr} .trow .pri{grid-column:2} }

/* utility classes (replacing former inline styles) */
.u-mt0{margin-top:0}.u-mt6{margin-top:6px}.u-mt8{margin-top:8px}.u-mt12{margin-top:12px}.u-mt14{margin-top:14px}
.u-m6010{margin:6px 0 10px}.u-m8002{margin:8px 0 2px}
.u-f15{font-size:15px}.u-f145d{font-size:14.5px;color:var(--ink2)}
.u-f15w74{font-size:15px;max-width:74ch}.u-f14d-mt8{font-size:14px;color:var(--ink2);margin-top:8px}
.u-f15d{color:var(--ink2);font-size:15px}.u-f15-mt6{font-size:15px;margin-top:6px}
.u-mono12d{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink2)}
.u-row12{display:flex;gap:12px;align-items:flex-start}
.u-row8-mt10{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.u-rowc8-mt10{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.u-between8{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.u-rule-mt26{border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-top:26px}
.u-flex1{flex:1}.u-w46{width:46%}
.u-bg-mu{background:var(--mu)}.u-bg-rs{background:var(--rs)}.u-bg-seal{background:var(--seal)}
.u-box-rs{background:var(--rs-soft);border-color:var(--rs)}
.u-box-sa{background:var(--sa-soft);border-color:var(--sa)}
.u-box-miss{background:var(--miss-soft);border-color:var(--miss)}
.manifest{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink2);margin:10px 0 0;padding-left:26px;columns:2;column-gap:26px}
.manifest li{margin-bottom:3px;break-inside:avoid}
.manifest a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink2)}
.manifest a:hover{color:var(--ink)}
@media(max-width:760px){.manifest{columns:1}}
.warnbox{background:var(--miss-soft);border:1px solid var(--miss);border-left-width:4px;
  padding:12px 14px;border-radius:4px;font-size:14.5px;line-height:1.55;max-width:78ch}
.gsearch{width:100%;max-width:420px;padding:9px 12px;margin-top:14px;font-family:inherit;font-size:14.5px;
  border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}
.gsearch:focus{outline:none;border-color:var(--ink2)}
dl.gloss{margin:8px 0 0}
dl.gloss dt{margin-top:12px;font-size:15px}
dl.gloss dd{margin:2px 0 0;padding-left:0;font-size:14.5px;color:var(--ink2);line-height:1.55;max-width:78ch}
.gterm{font-weight:600;color:var(--ink)}
.gtr{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--ink2);letter-spacing:.02em}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="mast">
    <div>
      <div class="eyebrow" data-l="eyebrow"></div>
      <h1><span data-l="title"></span></h1>
      <div class="sub" data-l="subtitle"></div>
    </div>
    <div class="langbox" role="group" aria-label="Language">
      <button id="lang-en" onclick="setLang('en')">English</button>
      <button id="lang-bn" onclick="setLang('bn')">বাংলা</button>
    </div>
  </div>
</div></header>

<nav><div class="wrap"><div class="tabs" id="tabbar"></div></div></nav>

<main><div class="wrap">
  <section class="tabpane" id="pane-overview"></section>
  <section class="tabpane" id="pane-sham"></section>
  <section class="tabpane" id="pane-jal"></section>
  <section class="tabpane" id="pane-baruna"></section>
  <section class="tabpane" id="pane-rec"></section>
  <section class="tabpane" id="pane-trk"></section>
  <section class="tabpane" id="pane-gloss"></section>
  <div class="footer" data-l="footer"></div>
</div></main>

function badge(t){const m={sa:['b-sa',{en:'S.A.',bn:'এস.এ.'}],rs:['b-rs',{en:'R.S.',bn:'আর.এস.'}],mu:['b-mu',{en:'Mutation',bn:'নামজারি'}],deed:['b-deed',{en:'Deed / Court',bn:'দলিল / আদালত'}],adm:['b-deed',{en:'Certificate',bn:'সনদ'}]}[t];
 return `<span class="badge ${m[0]}">${m[1][lang]}</span>`}
function statChip(st){const c={have:'s-have',photo:'s-photo',miss:'s-miss'}[st];return `<span class="stat ${c}">${SYM[st]} ${L[st==='have'?'have':st==='photo'?'photo':'miss'][lang]}</span>`}
function srcBadge(k){ if(k==='22')return badge('rs')+` <span class="mono">${nb('22')}</span>`;
 if(k==='26')return badge('rs')+` <span class="mono">${nb('26')}</span>`;
 return `<span class="badge b-rs">${t({en:'R.S.',bn:'আর.এস.'})}</span> <span class="mono">${nb(k)}</span>`}

    <div class="chain"><strong>${L.chainT[lang]}:</strong>

    </div>

 </div>`;

function plotTable(list){
 let r=list.map(p=>`<tr><td class="mono">${nb(p.d)}</td><td>${CLS[p.c][lang]}</td><td class="num">${nb(p.h)}</td><td class="num">${nb(p.f)}</td><td class="num">${nb(p.a)}</td><td>${srcBadge(p.k)}</td></tr>`).join('');
 return `<div class="tblwrap"><table><thead><tr><th>${L.dag[lang]}</th><th>${L.cls[lang]}</th><th>${L.hold[lang]}</th><th>${L.share[lang]}</th><th>${L.area[lang]}</th><th>${L.src[lang]}</th></tr></thead><tbody>${r}</tbody></table></div>`;
}
function mouzaPane(id,list,mouza,intro,total,extra){
 const pane=$(id); let sel=pane.dataset.sel||'0';
 const pills=list.map((p,i)=>`<button class="${sel==String(i)?'on':''}" onclick="selPlot('${id}','${mouza}',${i})">${nb(p.d)}</button>`).join('')
   +`<button class="${sel==='all'?'on':''}" onclick="selPlot('${id}','${mouza}','all')">${L.all[lang]}</button>`;
 const body = sel==='all'? plotTable(list) : plotDetail(list[Number(sel)],mouza);
 pane.innerHTML=`<h2>${intro.t[lang]}</h2><p class="lead">${q(intro.p[lang])}</p>
  <div class="pills" role="tablist">${pills}</div>${body}
  <p class="u-mt14"><strong>${L.tot[lang]}:</strong> ${total[lang]}</p>${extra?extra():''}`;
}

  </tr></thead><tbody>${orow}</tbody></table></div>
  <p class="u-f145d u-mt10">${q(t({en:'B.R.S. Khatiyan 193 was printed on 26 July 2026 and records the two sons as owners of dag 2898 — a dag that appears in Deed 2994’s schedule [?]. So the current record of rights does not reflect that sale. That is a real conflict between a registered instrument and the state’s current record, and it is the strongest documentary point in the file. Two cautions: the copy held is an online print, not a certified copy (জাবেদা নকল), which any legal use will require; and a survey record can be prepared without giving effect to an unmutated transfer, so this establishes the record position rather than settling the sale’s validity. Family information puts about 40 shatak in Ali Akbar’s name — this khatiyan accounts for roughly 13, so other khatiyans in his name are likely to exist. See the tracker.',bn:'বি.আর.এস. খতিয়ান ১৯৩ মুদ্রিত হইয়াছে ২৬ জুলাই ২০২৬ তারিখে এবং উহাতে দাগ ২৮৯৮-এর মালিক হিসাবে দুই পুত্রের নাম রহিয়াছে — যে দাগটি দলিল ২৯৯৪-এর তফসিলেও [?] আছে। অর্থাৎ বর্তমান স্বত্বলিপিতে ঐ বিক্রয়ের প্রতিফলন নাই। রেজিস্ট্রিকৃত দলিল ও রাষ্ট্রের বর্তমান রেকর্ডের মধ্যে ইহা একটি প্রকৃত বিরোধ, এবং নথির মধ্যে ইহাই সবচেয়ে শক্তিশালী দালিলিক বিষয়। দুইটি সতর্কতা: হাতে থাকা কপিটি অনলাইন প্রিন্ট, জাবেদা নকল নহে — আইনগত কাজে জাবেদা নকল লাগিবে; এবং নামজারিবিহীন হস্তান্তরকে কার্যকর না করিয়াও জরিপ রেকর্ড প্রস্তুত হইতে পারে, তাই ইহা রেকর্ডের অবস্থান প্রমাণ করে, বিক্রয়ের বৈধতা নিষ্পত্তি করে না। পারিবারিক তথ্যে আলী আকবরের নামে আনু. ৪০ শতক — এই খতিয়ানে প্রায় ১৩ শতক, সুতরাং তাঁহার নামে আরও খতিয়ান থাকিবার সম্ভাবনা রহিয়াছে। ট্র্যাকার দেখুন।'}))}</p>

/* ---------- glossary ---------- */
let glossQ='';
window.glossFilter=v=>{glossQ=v.toLowerCase();paintGloss();};
function paintGloss(){
 const wrap=$('gloss-body'); if(!wrap) return;
 let total=0, out='';
 GLOSS.forEach(sec=>{
   const hits=sec.items.filter(it=>{
     if(!glossQ) return true;
     return (it.b+' '+it.t+' '+it.e+' '+it.n).toLowerCase().includes(glossQ);
   });
   if(!hits.length) return;
   total+=hits.length;
   out+=`<h3 class="u-rule-mt26">${sec.g[lang]}</h3><dl class="gloss">`;
   hits.forEach(it=>{
     out+=`<dt><span class="gterm">${it.b}</span> <span class="gtr">${it.t}</span></dt>
           <dd>${q(lang==='bn'?it.n:it.e)}</dd>`;
   });
   out+='</dl>';
 });
 if(!total) out=`<p class="note-io u-mt14">${t({en:'No terms match that search.',bn:'এই অনুসন্ধানে কোনো পরিভাষা মিলে নাই।'})}</p>`;
 wrap.innerHTML=out;
}
function glossary(){
 const n=GLOSS.reduce((a,s)=>a+s.items.length,0);
 $('pane-gloss').innerHTML=`<h2>${t({en:'Glossary of Bengali land and legal terms',bn:'বাংলা ভূমি ও আইনি পরিভাষা'})}</h2>
  <p class="lead">${q(t({
    en:'Every Bengali term that appears in the documents on this site, grouped by subject. Definitions are working explanations for reading these records — they are not legal definitions and do not state the law.',
    bn:'এই সাইটের নথিসমূহে ব্যবহৃত বাংলা পরিভাষা, বিষয়ভিত্তিকভাবে সাজানো। ব্যাখ্যাগুলি এই রেকর্ড পড়িবার সহায়ক বিবরণ মাত্র — আইনি সংজ্ঞা নহে এবং আইনের বক্তব্য নহে।'}))}</p>
  <input id="gloss-search" class="gsearch" type="search" oninput="glossFilter(this.value)"
     placeholder="${t({en:'Search '+n+' terms — Bengali or English…',bn:n+'টি পরিভাষায় অনুসন্ধান — বাংলা বা ইংরেজি…'})}">
  <div id="gloss-body"></div>`;
 const el=$('gloss-search'); if(el) el.value=glossQ;
 paintGloss();
}

    ${r.file?`<div class="u-rowc8-mt10">${(Array.isArray(r.file)?r.file:[{f:r.file}]).map(o=>`<a class="reclink" href="records/${encodeURI(o.f)}" target="_blank" rel="noopener">📄 ${o.l?o.l[lang]:(t({en:'View copy',bn:'নকল দেখুন'}))}</a> <span class="recfile">records/${o.f}</span>`).join(' ')}</div>`:''}
   </div>`;
 let out=`<h2>${t({en:'Record library',bn:'খতিয়ান ও দলিলের ভান্ডার'})}</h2>
  <p class="lead">${t({en:'Grouped by mouza — each record’s type, holders, total and copy status.',bn:'মৌজা-ওয়ারি সাজানো — প্রতিটি রেকর্ডের ধরন, ধারক, মোট পরিমাণ ও নকলের অবস্থা।'})}</p>
  <p class="note-io u-mt6">${lang==='bn'
    ?'“নকল দেখুন” লিংকগুলি এই পাতার পাশের records/ ফোল্ডারের স্ক্যান-ফাইল খোলে। গিটহাব রিপোজিটরিতে ঐ নামের ফোল্ডার তৈরি করিয়া প্রতিটি স্ক্যান লিংকের পাশে দেখানো হুবহু নামে আপলোড করিলেই লিংক কাজ করিবে।'
    :'The “View copy” links open scans from a records/ folder next to this page. Create that folder in your GitHub repository and upload each scan with the exact filename shown beside the link — the links then work automatically.'}</p>`;
 G.forEach(g=>{
   const items=RECS.filter(r=>r.m===g.id);
   out+=`<h3 class="u-rule-mt26">${q(g.t[lang])}</h3>
    <div class="grid g2 u-mt12">${items.map(card).join('')}</div>`;
 });
 /* ---- file manifest: every filename this page expects in records/ ---- */
 const files=[];
 RECS.forEach(r=>{ if(!r.file) return;
   (Array.isArray(r.file)?r.file:[{f:r.file}]).forEach(o=>{ if(!files.includes(o.f)) files.push(o.f); }); });
 files.sort();
 out+=`<h3 class="u-rule-mt26">${t({en:'Files expected in records/',bn:'records/ ফোল্ডারে প্রত্যাশিত ফাইলসমূহ'})}</h3>
  <p class="note-io u-mt6">${t({en:'Generated automatically from the record library above. Every filename below must exist in the records/ folder, spelled exactly as shown, or its link will not open.',bn:'উপরের রেকর্ড ভান্ডার হইতে স্বয়ংক্রিয়ভাবে প্রস্তুতকৃত। নিম্নের প্রতিটি ফাইল হুবহু এই নামে records/ ফোল্ডারে থাকিতে হইবে, নতুবা লিংক খুলিবে না।'})}</p>
  <p class="u-f145d u-mt6">${nb(files.length)} ${t({en:'files',bn:'টি ফাইল'})}</p>
  <ol class="manifest">${files.map(f=>`<li><a href="records/${encodeURIComponent(f)}">${f}</a></li>`).join('')}</ol>`;
 $('pane-rec').innerHTML=out;
}
function tracker(){
 const counts={have:0,photo:0,miss:0};
 TRK.filter(t=>t.id).forEach(t=>counts[trkState[t.id]||t.d]++);
 let html=`<h2>${t({en:'Land records tracker',bn:'ভূমি রেকর্ড ট্র্যাকার'})}</h2>
  <p class="lead">${L.trkHow[lang]} <span class="note-io">${storageOK?L.saved[lang]:L.nosave[lang]}</span></p>
  <div class="trk-sum">
   <span class="pill u-box-rs">☑ ${nb(counts.have)} — ${L.have[lang]}</span>
   <span class="pill u-box-sa">◐ ${nb(counts.photo)} — ${L.photo[lang]}</span>
   <span class="pill u-box-miss">☐ ${nb(counts.miss)} — ${L.miss[lang]}</span>
   <button class="btn" onclick="resetTrk()">${L.reset[lang]}</button>
  </div>`;
 TRK.forEach(t=>{
  if(t.g){html+=`<div class="tgroup">${t.g[lang]}</div>`;return;}
  const st=trkState[t.id]||t.d;
  const pri=t.p==='—'?'—':L[t.p][lang];
  html+=`<div class="trow">
    <button class="st ${st}" aria-label="${L.status[lang]}" onclick="cycTrk('${t.id}')">${SYM[st]}</button>
    <div class="nm">${q(lang==='bn'?t.bn:t.en)}<span class="w">${q(t.w[lang])}</span></div>
    <div class="pri">${L.pri[lang]}: ${pri}</div></div>`;
 });
 $('pane-trk').innerHTML=html;
}
window.cycTrk=async id=>{
 const item=TRK.find(t=>t.id===id); const cur=trkState[id]||item.d;
 trkState[id]=CYCLE[(CYCLE.indexOf(cur)+1)%3];
 tracker(); saveTrk();
};
window.resetTrk=()=>{ if(confirm(t({en:'Reset all statuses to the defaults?',bn:'সব অবস্থা পূর্বনির্ধারিত মানে ফিরিবে?'}))){trkState={};tracker();saveTrk();} };
async function saveTrk(){ if(!storageOK)return; try{ await window.storage.set('akram-estate-tracker-v1', JSON.stringify(trkState)); }catch(e){} }
async function loadTrk(){ if(!(window.storage&&window.storage.get)){storageOK=false;return;} storageOK=true;
 try{ const r=await window.storage.get('akram-estate-tracker-v1'); if(r&&r.value)trkState=JSON.parse(r.value)||{}; }catch(e){ trkState={}; } }
/* ---------- tabs & lang ---------- */
const TABIDS=['pane-overview','pane-sham','pane-jal','pane-baruna','pane-rec','pane-trk','pane-gloss'];
let tab=0;
function drawTabs(){ $('tabbar').innerHTML=L.tabs[lang].map((t,i)=>`<button class="${i===tab?'on':''}" onclick="setTab(${i})">${t}</button>`).join(''); 
 TABIDS.forEach((id,i)=>$(id).classList.toggle('on',i===tab)); }
window.setTab=i=>{tab=i;render();window.scrollTo({top:0});};
window.setLang=l=>{lang=l;document.documentElement.lang=l;render();};
function render(){
 $('lang-en').classList.toggle('on',lang==='en'); $('lang-bn').classList.toggle('on',lang==='bn');
 document.querySelectorAll('[data-l]').forEach(el=>{el.innerHTML=q(L[el.dataset.l][lang]);});
 drawTabs(); overview();
 mouzaPane('pane-sham',SHAM,'sham',
  {t:{en:'Mouza Shamerkona — J.L. 102, Moulvibazar Sadar',bn:'মৌজা শামেরকোনা — জে.এল. ১০২, মৌলভীবাজার সদর'},
   p:{en:'Three plots from R.S. Khatiyan 22, half mutated to the heirs in 2024 (Mutation 1224, DCR paid 30/03/2024). The other half is with Late Nurul Islam’s line.',
      bn:'আর.এস. খতিয়ান ২২-এর তিনটি দাগ; ২০২৪-এ অর্ধেক ওয়ারিশগণের নামে নামজারি (নামজারি ১২২৪, ডিসিআর ৩০/০৩/২০২৪)। বাকি অর্ধেক প্রয়াত নুরুল ইসলামের পক্ষে।'}},
  {en:'25.50 shatak = 0.255 acre (in words on the record: zero acre, twenty-five shatak fifty).',bn:'২৫.৫০ শতক = ০.২৫৫ একর (রেকর্ডে কথায়: শূন্য একর পঁচিশ শতক পঞ্চাশ)।'},
  shamExtra);
 mouzaPane('pane-jal',JAL,'jal',
  {t:{en:'Mouza Jalalpur — J.L. 119, Rajnagar',bn:'মৌজা জালালপুর — জে.এল. ১১৯, রাজনগর'},
   p:{en:'Twenty-three plot entries under Mutation Khatiyan 1157 (2024), drawn from source khatiyans 16, 14, 18, 17 and 15 — plus Khatiyan 26, already in the brothers’ names. Every figure reconciles: page-1 subtotal 4-87.20, grand total 5-81.20. Separately, Khatiyan 500 [?] records a Jalalpur holding in the sole name of the late Nurul Islam — not part of the totals below; see the Records tab.',
      bn:'নামজারি খতিয়ান ১১৫৭ (২০২৪)-এর ২৩টি দাগ-এন্ট্রি — আগত খতিয়ান ১৬, ১৪, ১৮, ১৭ ও ১৫ হইতে — সহ খতিয়ান ২৬, যাহা আগেই ভাইদের নামে। প্রতিটি অঙ্ক মিলে: ১ম পৃষ্ঠার উপ-মোট ৪-৮৭.২০, সর্বমোট ৫-৮১.২০। ইহা ছাড়া খতিয়ান ৫০০ [?]-এ প্রয়াত নুরুল ইসলামের একক নামে জালালপুরের একটি সম্পত্তি লিপিবদ্ধ — নিম্নের মোটের অন্তর্ভুক্ত নহে; রেকর্ড ট্যাব দেখুন।'}},
  {en:'581.20 shatak = 5.812 acres (in words on the record: five point eight one two acres only) — plus 21.51 Sh in Khatiyan 26.',
   bn:'৫৮১.২০ শতক = ৫.৮১২ একর (রেকর্ডে কথায়: পাঁচ দশমিক আট এক দুই একর মাত্র) — সহ খতিয়ান ২৬-এ ২১.৫১ শঃ।'});
 baruna(); recs(); tracker(); glossary();
}
(async()=>{ await loadTrk(); render(); })();
</script>
